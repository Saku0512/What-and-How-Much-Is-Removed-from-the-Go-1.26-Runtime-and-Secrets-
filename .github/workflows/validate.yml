name: Validate runtime/secret

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install gcore
        run: sudo apt-get update && sudo apt-get install -y gdb

      - name: Run unit tests
        env:
          GOEXPERIMENT: runtimesecret
        run: go test ./...

      - name: Capture and scan core dumps
        env:
          USE_SUDO_GCORE: '1'
          KEEP_CORES: '0'
        run: ./scripts/run.sh artifacts/ci

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-secret-results
          path: |
            artifacts/ci/*.tsv
            artifacts/ci/*.json
            artifacts/ci/*.log
            artifacts/ci/*.txt
          if-no-files-found: warn
